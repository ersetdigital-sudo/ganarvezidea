 <nav class="relative text-sm text-[#6b6358]"><a href="/" class="hover:text-[#1c1a17]">Home</a> / <a href="/#layanan" class="hover:text-[#1c1a17]">Layanan</a> / <span class="text-[#1c1a17]" id="bc"></span></nav>
 <div id="tabs" class="relative mt-4 hidden flex-wrap gap-2 md:flex"></div>
 <div class="relative mt-6 flex items-center gap-4"><div id="ic" class="ico w-20 shrink-0 sm:w-24"></div><div class="min-w-0"><h1 id="tt" class="text-2xl font-extrabold sm:text-4xl"></h1><p id="ds" class="mt-1 text-sm text-[#6b6358] sm:text-base"></p></div></div>

<script>
const k=new URLSearchParams(location.search).get('s'),key=SVC[k]?k:'pln',S=SVC[key];let sel=-1;document.title=S.n+' — ganarvezidea';
bc.textContent=tt.textContent=sl.textContent=S.n;ds.textContent=S.d;ic.classList.add('i-'+S.i);lb.textContent=S.lbl;no.placeholder=S.ph;
if(key=='bpjs')pt.textContent='Pilih jumlah bulan iuran';if(key=='data')pt.textContent='Pilih paket';if(key=='pdam')pt.textContent='Pilih tagihan';
if(S.pt)pt.textContent=S.pt;
if(S.reg){regw.classList.remove('hidden');rl.textContent=S.reg[0];reg.innerHTML=S.reg[1].map(x=>`<option>${x}</option>`).join('')}
tabs.innerHTML=Object.entries(SVC).map(([x,v])=>`<a href="/layanan?s=${x}" class="chip inline-flex items-center gap-1.5 ${x==key?'on':''}">${SVG[v.i]}${v.n}</a>`).join('');
nic.innerHTML=S.op?SVG.phone:SVG.id;if(S.reg)rl.innerHTML=`<span class="inline-flex items-center gap-1.5"><span class="text-[#12A150]">${SVG.pin}</span>${S.reg[0]}</span>`;
pt.innerHTML=`<span class="inline-flex items-center gap-2"><span class="text-[#12A150]">${SVG[S.i]}</span>${pt.textContent}</span>`;
if(S.op){opl.classList.replace('hidden','grid');oph.classList.remove('hidden');opl.innerHTML=OPS.map(o=>`<div class="opcard card flex items-center justify-center p-2" data-o="${o[0]}">${lg(o[0],'')}</div>`).join('');fillLogos()}
opts.innerHTML=S.p.map((p,i)=>`<button class="card opt hov relative p-4 text-left" data-i="${i}"><span class="ck absolute right-3 top-3 hidden h-5 w-5 items-center justify-center rounded-full bg-[#12A150] text-[#1c1a17]">${SVG.check.replace('h-4 w-4','h-3 w-3')}</span><div class="text-sm font-bold">${p.t}</div><div class="mt-2 text-sm font-semibold text-[#12A150]">${rp(p.h)}</div></button>`).join('');
function upd(){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',+b.dataset.i==sel));sn.textContent=no.value||'-';sp.textContent=sel>=0?S.p[sel].t:'-';st.textContent=rp(sel>=0?S.p[sel].h:0);
 document.querySelectorAll('.opt').forEach(b=>{const c=b.querySelector('.ck');c.classList.toggle('hidden',+b.dataset.i!=sel);c.classList.toggle('flex',+b.dataset.i==sel)});
 if(S.op){const o=detectOp(no.value);opb.innerHTML=o?lg(o[0],'pop'):'';fillLogos();document.querySelectorAll('.opcard').forEach(c=>c.classList.toggle('on',!!o&&c.dataset.o==o[0]));
  const d=no.value.replace(/\D/g,'');oph.innerHTML=o?`<span class="text-green-700">✓ Terdeteksi: <b>${o[0]}</b></span>`:d.length>=4?'<span class="text-red-600">Operator tidak dikenali, cek kembali nomor kamu.</span>':'Operator akan terdeteksi otomatis dari 4 digit awal nomor.';}}
opts.onclick=e=>{const b=e.target.closest('.opt');if(b){sel=+b.dataset.i;upd()}};no.oninput=()=>{no.value=no.value.replace(/[^\d]/g,'');upd()};
go.onclick=()=>{if(no.value.length<6){er.textContent='Masukkan nomor yang valid.';return}if(sel<0){er.textContent='Pilih nominal/produk dulu.';return}
 const o=S.op&&detectOp(no.value);try{sessionStorage.order=JSON.stringify({l:S.n+(o?' '+o[0]:'')+(S.reg?' · '+reg.value:''),n:no.value,p:S.p[sel].t,h:S.p[sel].h})}catch(e){}location.href='/bayar'};
upd();
</script>
